<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="彩虹糖下雨 — 根据小朋友于2026年11月1日亲手绘制的设计稿还原的趣味网页小游戏，支持电脑键盘与iPad/手机触屏。" />
  <meta property="og:title" content="彩虹糖下雨 (Rainbow Candy Rain)" />
  <meta property="og:description" content="根据小朋友于2026年11月1日亲手绘制的设计稿还原的趣味网页小游戏，支持电脑键盘与iPad/手机触屏。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="artwork.jpg" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>" />
  <title>彩虹糖下雨 — 游戏大厅</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100dvh;
      background: #2c241d radial-gradient(circle at center, #4a3b2f 0%, #231c15 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Comic Sans MS", cursive, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: #282a24;
    }
    .hub-card {
      background: #fbf9f4;
      border: 3.5px solid #282a24;
      border-radius: 24px;
      max-width: 640px;
      width: 100%;
      padding: 24px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .hub-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2.5px dashed #d5cbb8;
    }
    .hub-header h1 {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .hub-header p {
      font-size: 13.5px;
      color: #555;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .game-card {
      display: block;
      text-decoration: none;
      color: #282a24;
      background: #fff;
      border: 3px solid #282a24;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 5px 0 #282a24;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }
    .game-card.playable:hover {
      background: #fffbe6;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #282a24;
    }
    .game-card.playable:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #282a24;
    }
    .game-card.coming-soon {
      background: #f4efe6;
      border: 2.5px dashed #999;
      box-shadow: none;
      opacity: 0.85;
      cursor: default;
    }
    .g-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .g-badge {
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 999px;
      border: 2px solid #282a24;
      font-weight: 800;
    }
    .badge-play {
      background: #d4f5b4;
    }
    .badge-wait {
      background: #e2ddd3;
      border-color: #777;
      color: #666;
    }
    .g-desc {
      font-size: 14px;
      color: #444;
      line-height: 1.55;
    }
    .g-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1.5px dashed #ede5d8;
    }
    .g-file {
      font-size: 12px;
      color: #777;
      font-family: monospace;
    }
    .g-action {
      font-size: 13px;
      font-weight: 900;
      color: #cf2027;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="hub-card">
    <div class="hub-header">
      <h1>🌈 游戏大厅 (Game Hub)</h1>
      <p>源自女儿 2026年11月1日 原创手绘设计 ｜ 电脑键盘 & 平板/手机触屏全兼容</p>
    </div>

    <div class="game-list">
      <!-- 经典版游戏卡片 -->
      <a class="game-card playable" href="v1_classic.html">
        <div class="g-title">
          <span>🍬 彩虹糖下雨 (Rainbow Candy Rain)</span>
          <span class="g-badge badge-play">▶ 立即游玩</span>
        </div>
        <div class="g-desc">
          云朵嘴边准备彩色糖果，对准下方的同色糖果管落入，每个管子装满 10 颗即可通关胜利！糖果饱满立体，画面纯真精致。
        </div>
        <div class="g-footer">
          <span class="g-file">游戏文件：v1_classic.html</span>
          <span class="g-action">进入游戏 ➔</span>
        </div>
      </a>

      <!-- 未来新游戏卡片预留 -->
      <div class="game-card coming-soon">
        <div class="g-title">
          <span style="color: #666;">✨ 更多游戏 (More Games)</span>
          <span class="g-badge badge-wait">敬请期待</span>
        </div>
        <div class="g-desc">
          新的童趣创意与奇思妙想正在酝酿中，未来将收录更多好玩的自制小游戏！
        </div>
        <div class="g-footer" style="border-top-color: #ddd;">
          <span class="g-file" style="color: #999;">Coming Soon...</span>
          <span style="font-size: 12px; color: #888;">即将推出 🚀</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
