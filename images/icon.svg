<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Apiapia 游戏大厅 · 应用图标（圆角方形 + 彩虹 + 猫头） -->
  <defs>
    <clipPath id="head">
      <path d="M28 122 C28 74 60 54 100 54 C140 54 172 74 172 122 C172 162 142 184 100 184 C58 184 28 162 28 122 Z"/>
    </clipPath>
  </defs>
  <defs><clipPath id="tile"><rect x="6" y="6" width="188" height="188" rx="44"/></clipPath></defs>
  <rect x="6" y="6" width="188" height="188" rx="44" fill="#fffbe6"/>
