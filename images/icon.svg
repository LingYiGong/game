    <path d="M91 136 L109 136 L100 146 Z" fill="#ec9a93" stroke-width="4.5"/>
    <path d="M100 146 V151 M100 151 C96 158 88 157 86 151 M100 151 C104 158 112 157 114 151" fill="none" stroke-width="4"/>
  </g>
    <g stroke="#282a24" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M40 140 L12 134"/><path d="M40 150 L12 154"/>
      <path d="M160 140 L188 134"/><path d="M160 150 L188 154"/>
    </g>
