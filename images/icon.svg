    <path d="M13 150 A87 87 0 0 1 187 150" stroke="#e36517" stroke-width="9.6" fill="none"/>
    <path d="M22 150 A78 78 0 0 1 178 150" stroke="#f5c518" stroke-width="9.6" fill="none"/>
