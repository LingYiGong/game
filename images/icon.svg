      <path d="M10 30 H190 V116 C168 112 154 92 134 88 C118 85 108 76 100 64 C92 76 82 85 66 88 C46 92 32 112 10 116 Z" fill="#9b8f7e" stroke="none"/>
      <g stroke="#3d362e" stroke-width="5.5" fill="none">
        <path d="M80 58 L85 78"/>
        <path d="M91 54 L93 68"/>
        <path d="M120 58 L115 78"/>
        <path d="M109 54 L107 68"/>
        <path d="M30 96 L48 92"/>
        <path d="M170 96 L152 92"/>
      </g>
    </g>
    <path d="M28 122 C28 74 60 54 100 54 C140 54 172 74 172 122 C172 162 142 184 100 184 C58 184 28 162 28 122 Z" fill="none" stroke-width="7"/>
    <!-- 眼睛 -->
    <circle cx="70" cy="114" r="20" fill="#d9dc3f" stroke-width="5.5"/>
    <circle cx="130" cy="114" r="20" fill="#d9dc3f" stroke-width="5.5"/>
    <ellipse cx="70" cy="115" rx="4.5" ry="14" fill="#282a24" stroke="none"/>
    <ellipse cx="130" cy="115" rx="4.5" ry="14" fill="#282a24" stroke="none"/>
    <circle cx="63" cy="106" r="4.5" fill="#fff" stroke="none"/>
    <circle cx="123" cy="106" r="4.5" fill="#fff" stroke="none"/>
    <!-- 腮红 -->
    <ellipse cx="52" cy="146" rx="12" ry="6.5" fill="#f39bc3" opacity="0.6" stroke="none"/>
    <ellipse cx="148" cy="146" rx="12" ry="6.5" fill="#f39bc3" opacity="0.6" stroke="none"/>
